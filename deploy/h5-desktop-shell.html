<!DOCTYPE html>
<html lang="zh-CN">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>不出寝履约端</title>

<head>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 28px 16px;
      background: radial-gradient(1200px 700px at 50% -10%, #123a2b 0%, #0b2118 55%, #061410 100%);
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      overflow: hidden;
    }
    .app-title {
      color: rgba(255, 255, 255, 0.92);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 2px;
    }
    .app-title b { color: #b9f227; }
    .phone {
      width: min(430px, 100vw - 32px);
      height: min(860px, 100vh - 130px);
      border-radius: 44px;
      padding: 10px;
      background: linear-gradient(160deg, #3a4a40, #16211b);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55), inset 0 0 0 1px rgba(255, 255, 255, 0.08);
    }
    .screen {
      width: 100%;
      height: 100%;
      border-radius: 35px;
      overflow: hidden;
      background: #f7f5ef;
      position: relative;
    }
    .screen iframe { display: block; width: 100%; height: 100%; border: 0; }
    .notch {
      position: absolute;
      top: 10px; left: 50%;
      transform: translateX(-50%);
      width: 110px; height: 22px;
      border-radius: 12px;
      background: #16211b;
      z-index: 2;
    }
    .copyright {
      color: rgba(255, 255, 255, 0.35);
      font-size: 12px;
      font-weight: 300;
      letter-spacing: 1px;
    }
  </style>
</head>

<body>
  <div class="app-title">不出寝<b>履约端</b> · 配送工作台 H5</div>
  <div class="phone">
    <div class="screen">
      <div class="notch"></div>
      <iframe src="/h5/delivery/m/"></iframe>
    </div>
  </div>
  <div class="copyright">不出寝食社 · 校园零售配送服务平台</div>
  <script>
    // 手机访问：直接跳转真实页面，不套壳
    if (matchMedia("(max-width: 560px)").matches) {
      location.replace("/h5/delivery/m/");
    }
  </script>
</body>

</html>
